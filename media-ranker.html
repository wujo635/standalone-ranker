<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Ranker</title>
<style>
  :root {
    --bg: #f8f7f5;
    --surface: #ffffff;
    --surface-2: #f2f1ef;
    --border: #e4e3e0;
    --border-strong: #cccbc8;
    --text-primary: #1a1a18;
    --text-secondary: #6b6b67;
    --text-muted: #9c9b97;
    --accent: #3b6fd4;
    --accent-bg: #eef2fc;
    --accent-text: #2a52a8;
    --accent-border: #c0cef4;
    --radius: 8px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #18181a;
      --surface: #232325;
      --surface-2: #2a2a2c;
      --border: #38383b;
      --border-strong: #4a4a4e;
      --text-primary: #f0efec;
      --text-secondary: #a0a09c;
      --text-muted: #686864;
      --accent: #6b9beb;
      --accent-bg: #1e2840;
      --accent-text: #91b5f4;
      --accent-border: #2e4070;
    }
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--bg); color: var(--text-primary); min-height: 100vh; }
  a { color: var(--accent); }

  /* Layout */
  .shell { max-width: 680px; margin: 0 auto; padding: 2rem 1rem 4rem; }
  header { margin-bottom: 2rem; }
  header h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.3px; }
  header p { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

  /* Nav */
  nav { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 1.5rem; }
  nav button { background: none; border: none; border-bottom: 2px solid transparent; padding: 8px 14px; font-size: 14px; color: var(--text-secondary); cursor: pointer; font-family: var(--font); transition: color .15s, border-color .15s; margin-bottom: -1px; }
  nav button:hover { color: var(--text-primary); }
  nav button.active { color: var(--text-primary); border-bottom-color: var(--text-primary); font-weight: 500; }

  /* Views */
  .view { display: none; }
  .view.active { display: block; }

  /* Cards */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: .75rem; }
  .card-title { font-size: 14px; font-weight: 500; margin-bottom: .5rem; }
  .card-desc { font-size: 13px; color: var(--text-secondary); margin-bottom: .75rem; }

  /* Form elements */
  input[type=text], select {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 7px 10px; font-size: 14px; color: var(--text-primary); font-family: var(--font);
    outline: none; transition: border-color .15s;
  }
  input[type=text]:focus, select:focus { border-color: var(--accent); }
  input[type=text]::placeholder { color: var(--text-muted); }
  select { cursor: pointer; }

  button {
    background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius);
    padding: 7px 14px; font-size: 14px; color: var(--text-primary); cursor: pointer; font-family: var(--font);
    transition: background .15s, border-color .15s;
  }
  button:hover { background: var(--surface-2); }
  button:active { transform: scale(0.98); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.primary:hover { opacity: .9; }

  /* Row layout */
  .row { display: flex; align-items: center; gap: 8px; }
  .flex1 { flex: 1; }

  /* Section label */
  .section-label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); margin-bottom: .5rem; font-weight: 500; }

  /* Item rows */
  .item-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .item-row:last-child { border-bottom: none; }
  .item-title { flex: 1; font-size: 14px; font-weight: 500; }
  .item-meta { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
  .btn-sm { padding: 4px 8px; font-size: 12px; }

  /* Empty state */
  .empty { text-align: center; color: var(--text-muted); font-size: 14px; padding: 2.5rem 0; }

  /* Rank / VS */
  .vs-hint { text-align: center; font-size: 13px; color: var(--text-muted); margin-bottom: 1rem; }
  .vs-wrap { display: flex; gap: 12px; align-items: stretch; margin-bottom: 1rem; }
  .vs-card {
    flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 1.25rem; cursor: pointer; transition: border-color .15s, box-shadow .15s;
    display: flex; flex-direction: column; gap: 8px;
  }
  .vs-card:hover { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
  .vs-card:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
  .vs-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 500; }
  .vs-title { font-size: 17px; font-weight: 600; }
  .vs-meta { font-size: 12px; color: var(--text-secondary); }
  .vs-sep { display: flex; align-items: center; padding: 0 4px; font-size: 13px; font-weight: 500; color: var(--text-muted); }
  .skip-row { text-align: center; }
  .skip-btn { font-size: 13px; color: var(--text-muted); border: none; background: none; padding: 4px 10px; }
  .skip-btn:hover { color: var(--text-primary); background: none; }

  /* Score bar */
  .score-bar { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; margin-top: 4px; }
  .score-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .4s; }

  /* Leaderboard */
  .cat-pills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1rem; }
  .pill { font-size: 12px; padding: 4px 12px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-secondary); cursor: pointer; font-family: var(--font); transition: background .15s; }
  .pill:hover { background: var(--border); }
  .pill.active { background: var(--accent-bg); color: var(--accent-text); border-color: var(--accent-border); }
  .rank-num { font-size: 16px; font-weight: 500; color: var(--text-muted); min-width: 30px; }
  .rank-medal { font-size: 16px; min-width: 30px; text-align: center; }

  /* Stats */
  .stat-row { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; border-bottom: 1px solid var(--border); }
  .stat-row:last-child { border-bottom: none; }
  .stat-label { color: var(--text-secondary); }
  .stat-val { font-weight: 500; }

  /* Toast */
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--text-primary); color: var(--bg); padding: 8px 18px;
    border-radius: 20px; font-size: 13px; font-weight: 500;
    opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap;
  }
  #toast.show { opacity: 1; }

  /* File input */
  input[type=file] { font-size: 13px; color: var(--text-secondary); }
</style>
</head>
<body>
<div class="shell">
  <header>
    <h1>Media Ranker</h1>
    <p>Track everything you've seen, heard, or read — then rank it.</p>
  </header>

  <nav>
    <button class="active" onclick="switchTab('library')">Library</button>
    <button onclick="switchTab('rank')">Rank</button>
    <button onclick="switchTab('leaderboard')">Leaderboard</button>
    <button onclick="switchTab('data')">Data</button>
  </nav>

  <!-- Library -->
  <div id="view-library" class="view active">
    <div class="card">
      <div class="section-label">Category</div>
      <div class="row" style="margin-bottom:.85rem">
        <select id="sel-cat" onchange="renderLibrary()"></select>
        <button onclick="addCustomCat()">+ New category</button>
      </div>
      <div class="section-label">Add item</div>
      <div class="row">
        <input type="text" id="inp-title" class="flex1" placeholder="Title…" onkeydown="if(event.key==='Enter')addItem()">
        <input type="text" id="inp-year" placeholder="Year" style="width:72px" onkeydown="if(event.key==='Enter')addItem()">
        <button class="primary" onclick="addItem()">Add</button>
      </div>
    </div>
    <div id="lib-list"></div>
  </div>

  <!-- Rank -->
  <div id="view-rank" class="view">
    <div class="row" style="margin-bottom:1rem;gap:8px">
      <div class="section-label" style="margin-bottom:0">Category</div>
      <select id="rank-cat" onchange="loadPair()"></select>
    </div>
    <div id="rank-pair"></div>
    <div class="skip-row">
      <button class="skip-btn" onclick="loadPair()">↻ Skip this pair</button>
    </div>
  </div>

  <!-- Leaderboard -->
  <div id="view-leaderboard" class="view">
    <div class="cat-pills" id="lb-cats"></div>
    <div id="lb-list"></div>
  </div>

  <!-- Data -->
  <div id="view-data" class="view">
    <div class="card">
      <div class="card-title">Export</div>
      <div class="card-desc">Download your entire library as a JSON file you can re-import later.</div>
      <button onclick="exportData()">↓ Export JSON</button>
    </div>
    <div class="card">
      <div class="card-title">Import</div>
      <div class="card-desc">Load a previously exported JSON file. Merges with your existing data — nothing is overwritten.</div>
      <input type="file" id="file-inp" accept=".json" onchange="importData(event)">
    </div>
    <div class="card">
      <div class="card-title">Stats</div>
      <div id="stats-list"></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const DEFAULT_CATS = ['Movies','Songs','Actors','Books','TV Shows'];
let state = { items: {}, cats: [...DEFAULT_CATS] };
let lbCat = 'Movies';

// --- Persistence ---
function save() {
  try { localStorage.setItem('media-ranker-v1', JSON.stringify(state)); } catch(e) {}
}
function load() {
  try {
    const raw = localStorage.getItem('media-ranker-v1');
    if (raw) state = JSON.parse(raw);
  } catch(e) {}
  rebuildCatSelects();
  renderLibrary();
  loadPair();
  renderLB();
  renderStats();
}

// --- Utilities ---
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

// --- Category selects ---
function rebuildCatSelects() {
  ['sel-cat','rank-cat'].forEach(id => {
    const sel = document.getElementById(id);
    const cur = sel.value;
    sel.innerHTML = state.cats.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
    if (state.cats.includes(cur)) sel.value = cur;
  });
}
function addCustomCat() {
  const name = prompt('Category name:');
  if (!name || !name.trim()) return;
  const n = name.trim();
  if (!state.cats.includes(n)) state.cats.push(n);
  rebuildCatSelects();
  document.getElementById('sel-cat').value = n;
  save(); renderLibrary(); toast('Category added: ' + n);
}

// --- Library ---
function libCat() { return document.getElementById('sel-cat').value; }
function libItems() { return Object.values(state.items).filter(i => i.cat === libCat()); }

function addItem() {
  const t = document.getElementById('inp-title').value.trim();
  const y = document.getElementById('inp-year').value.trim();
  if (!t) return;
  const id = uid();
  state.items[id] = { id, cat: libCat(), title: t, year: y, elo: 1000, wins: 0, losses: 0 };
  document.getElementById('inp-title').value = '';
  document.getElementById('inp-year').value = '';
  document.getElementById('inp-title').focus();
  save(); renderLibrary(); toast('Added: ' + t);
}

function deleteItem(id) {
  if (!confirm('Remove "' + state.items[id].title + '"?')) return;
  delete state.items[id]; save(); renderLibrary(); renderLB(); renderStats();
}

function renderLibrary() {
  const list = libItems().sort((a,b) => a.title.localeCompare(b.title));
  const el = document.getElementById('lib-list');
  if (!list.length) { el.innerHTML = '<div class="empty">No items yet — add one above.</div>'; return; }
  el.innerHTML = '<div class="card">' + list.map(i => `
    <div class="item-row">
      <span class="item-title">${esc(i.title)}</span>
      <span class="item-meta">${esc(i.year)}</span>
      <span class="item-meta">ELO ${Math.round(i.elo)}</span>
      <button class="btn-sm" onclick="deleteItem('${i.id}')" aria-label="Remove ${esc(i.title)}">✕</button>
    </div>`).join('') + '</div>';
}

// --- Rank ---
function rankCat() { return document.getElementById('rank-cat').value; }

function loadPair() {
  const list = Object.values(state.items).filter(i => i.cat === rankCat());
  const el = document.getElementById('rank-pair');
  if (list.length < 2) {
    el.innerHTML = '<div class="empty">Add at least 2 items in this category to start ranking.</div>'; return;
  }
  const a = list[Math.floor(Math.random() * list.length)];
  let b; do { b = list[Math.floor(Math.random() * list.length)]; } while (b.id === a.id);

  el.innerHTML = `
    <div class="vs-hint">Which do you prefer?</div>
    <div class="vs-wrap">
      <div class="vs-card" onclick="vote('${a.id}','${b.id}')" tabindex="0" role="button" aria-label="Vote for ${esc(a.title)}">
        <span class="vs-label">Pick this</span>
        <span class="vs-title">${esc(a.title)}</span>
        <span class="vs-meta">${esc(a.year)} · ELO ${Math.round(a.elo)} · ${a.wins}W ${a.losses}L</span>
        <div class="score-bar"><div class="score-fill" style="width:${Math.min(100,Math.max(0,(a.elo-600)/8))}%"></div></div>
      </div>
      <div class="vs-sep">or</div>
      <div class="vs-card" onclick="vote('${b.id}','${a.id}')" tabindex="0" role="button" aria-label="Vote for ${esc(b.title)}">
        <span class="vs-label">Pick this</span>
        <span class="vs-title">${esc(b.title)}</span>
        <span class="vs-meta">${esc(b.year)} · ELO ${Math.round(b.elo)} · ${b.wins}W ${b.losses}L</span>
        <div class="score-bar"><div class="score-fill" style="width:${Math.min(100,Math.max(0,(b.elo-600)/8))}%"></div></div>
      </div>
    </div>`;

  el.querySelectorAll('.vs-card').forEach(c => c.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' ') c.click(); }));
}

function eloUpdate(winner, loser) {
  const K = 32, E = 1 / (1 + Math.pow(10, (loser.elo - winner.elo) / 400));
  winner.elo += K * (1 - E); loser.elo += K * (0 - 1 + E);
  winner.wins++; loser.losses++;
}

function vote(wid, lid) {
  eloUpdate(state.items[wid], state.items[lid]);
  save(); renderLB(); renderStats(); loadPair(); toast('✓ Voted');
}

// --- Leaderboard ---
function renderLB() {
  const allCats = [...new Set(Object.values(state.items).map(i => i.cat))];
  if (!allCats.includes(lbCat) && allCats.length) lbCat = allCats[0];

  document.getElementById('lb-cats').innerHTML = allCats.map(c =>
    `<button class="pill${c===lbCat?' active':''}" onclick="lbCat='${esc(c)}';renderLB()">${esc(c)}</button>`
  ).join('');

  const list = Object.values(state.items).filter(i => i.cat === lbCat).sort((a,b) => b.elo - a.elo);
  const el = document.getElementById('lb-list');
  if (!list.length) { el.innerHTML = '<div class="empty">Nothing here yet.</div>'; return; }

  const top = list[0].elo, bot = list[list.length-1].elo, range = top - bot || 1;
  const medals = ['🥇','🥈','🥉'];
  el.innerHTML = '<div class="card">' + list.map((i, idx) => `
    <div class="item-row">
      <span class="${idx<3?'rank-medal':'rank-num'}">${idx<3?medals[idx]:'#'+(idx+1)}</span>
      <div class="flex1">
        <div class="item-title">${esc(i.title)} <span class="item-meta" style="font-weight:400">${esc(i.year)}</span></div>
        <div class="score-bar" style="margin-top:5px"><div class="score-fill" style="width:${Math.round((i.elo-bot)/range*100)}%"></div></div>
      </div>
      <span class="item-meta">${Math.round(i.elo)} · ${i.wins}W ${i.losses}L</span>
    </div>`).join('') + '</div>';
}

// --- Data ---
function renderStats() {
  const counts = {};
  let totalVotes = 0;
  Object.values(state.items).forEach(i => { counts[i.cat] = (counts[i.cat]||0)+1; totalVotes += i.wins; });
  const total = Object.values(counts).reduce((a,b)=>a+b,0);
  const rows = [['Total items', total], ['Total comparisons', totalVotes], ...Object.entries(counts).map(([c,n])=>[c,n])];
  document.getElementById('stats-list').innerHTML = rows.map(([l,v]) =>
    `<div class="stat-row"><span class="stat-label">${esc(l)}</span><span class="stat-val">${v}</span></div>`
  ).join('');
}

function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'media-ranker.json'; a.click(); toast('Exported!');
}

function importData(e) {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = ev => {
    try {
      const d = JSON.parse(ev.target.result);
      if (d.items) Object.assign(state.items, d.items);
      if (d.cats) d.cats.forEach(c => { if (!state.cats.includes(c)) state.cats.push(c); });
      save(); rebuildCatSelects(); renderLibrary(); renderLB(); renderStats();
      toast('Imported ' + Object.keys(d.items||{}).length + ' items');
    } catch(err) { toast('Invalid JSON file'); }
  };
  r.readAsText(file);
}

// --- Tabs ---
function switchTab(id) {
  const ids = ['library','rank','leaderboard','data'];
  document.querySelectorAll('nav button').forEach((b,i) => b.classList.toggle('active', ids[i]===id));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id==='view-'+id));
  if (id==='rank') loadPair();
  if (id==='leaderboard') renderLB();
  if (id==='data') renderStats();
}

load();
</script>
</body>
</html>
